version: 1

AppDir:
  path: ./AppDir

  app_info:
    id: com.carlos.mkwiisetup
    name: setup
    icon: setup
    version: 3.0.1
    exec: usr/bin/setup
    exec_args: $@

  files:
    include: []
    exclude:
      - usr/share/man
      - usr/share/doc

  runtime:
    env:
      APPDIR: '$APPDIR'

AppImage:
  arch: x86_64
  update-information: None
